<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Espace propriétaire – Niger Beauté</title>
<style>
:root{--or:#ee7b1d;--vert:#14502b;--encre:#0d2a19;--sable:#fbe9c8;--b:3px solid var(--encre)}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--sable);color:var(--encre);line-height:1.45;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 60px}
header{background:var(--or);border-bottom:var(--b)}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px}
h1{font-size:1.1rem;font-weight:800}
h2{font-size:1.25rem;margin:22px 0 10px}
.btn{display:inline-block;background:var(--vert);color:#fff;border:var(--b);border-radius:12px;padding:11px 18px;font:700 1rem system-ui,sans-serif;cursor:pointer;box-shadow:3px 3px 0 var(--encre)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--encre)}
.btn.or{background:var(--or);color:var(--encre)}
.btn.gris{background:#fff;color:var(--encre)}
.btn.rouge{background:#b3261e}
.btn.petit{padding:7px 12px;font-size:.9rem;box-shadow:2px 2px 0 var(--encre)}
.carte{background:#fff;border:var(--b);border-radius:16px;box-shadow:5px 5px 0 var(--encre);padding:18px;margin-top:20px}
label{display:block;font-weight:700;margin:12px 0 4px}
input,textarea,select{width:100%;padding:11px 12px;border:var(--b);border-radius:10px;font:1rem system-ui,sans-serif;background:#fff}
textarea{min-height:90px;resize:vertical}
:focus-visible{outline:4px solid var(--or);outline-offset:2px}
#msg{margin-top:12px;font-weight:700}
#msg.err{color:#b3261e}#msg.ok{color:var(--vert)}
.barre{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.barre input{flex:1 1 180px}
.ligne{display:flex;gap:12px;align-items:center;background:#fff;border:var(--b);border-radius:14px;padding:10px;margin-top:12px}
.ligne img,.ligne .vide{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;border:2px solid var(--encre);background:#f1e4c9}
.ligne .t{flex:1;min-width:0}
.ligne b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ligne small{color:#4b5d52}
.ligne .act{display:flex;flex-direction:column;gap:6px}
dialog{border:var(--b);border-radius:16px;padding:18px;width:min(94vw,520px);box-shadow:8px 8px 0 var(--encre);background:#fff}
dialog::backdrop{background:rgba(13,42,25,.75)}
#prev{width:100%;max-height:240px;object-fit:contain;margin-top:8px;border-radius:10px}
.cache{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.cache .btn{flex:1}
code{background:#f1e4c9;padding:1px 5px;border-radius:5px}
</style>
</head>
<body>
<header><div class="wrap"><h1>Espace propriétaire · Niger Beauté</h1><button class="btn petit gris" id="out" type="button" hidden>Se déconnecter</button></div></header>
<main class="wrap">

<section class="carte" id="config" hidden>
 <h2 style="margin-top:0">Configuration à terminer</h2>
 <p>Ouvre ce fichier et remplace les 4 valeurs <code>COLLE_ICI</code>, en haut du script, par celles de ton projet Firebase (Paramètres du projet, puis Vos applications, puis l'application Web).</p>
</section>

<section class="carte" id="login">
 <h2 style="margin-top:0">Connexion</h2>
 <form id="fLogin">
  <label for="em">Adresse e-mail</label>
  <input id="em" type="email" autocomplete="username" required>
  <label for="pw">Mot de passe</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <div class="cache"><button class="btn or" type="submit">Se connecter</button></div>
 </form>
</section>

<section id="app" hidden>
 <div class="barre">
  <button class="btn or" id="ajout" type="button">+ Ajouter un produit</button>
  <input id="rech" type="search" placeholder="Chercher un produit" aria-label="Chercher un produit">
 </div>
 <p style="margin-top:10px"><small id="who"></small> · <small id="nb"></small></p>
 <div id="liste"></div>
</section>
<p id="msg" role="status"></p>
</main>

<dialog id="dlg">
 <h2 style="margin-top:0" id="dt">Produit</h2>
 <label for="fn">Nom du produit</label>
 <input id="fn" type="text" maxlength="120" placeholder="Ex. Cyrus Writer Gold">
 <label for="fc">Catégorie</label>
 <input id="fc" type="text" list="cats" maxlength="40" placeholder="Ex. Parfums">
 <datalist id="cats"></datalist>
 <label for="fd">Description</label>
 <textarea id="fd" maxlength="400" placeholder="Quelques mots sur le produit"></textarea>
 <label for="fp">Prix en F CFA (laisse vide pour « Prix sur WhatsApp »)</label>
 <input id="fp" type="number" inputmode="numeric" min="0" step="1" placeholder="Ex. 15000">
 <label for="ff">Photo</label>
 <input id="ff" type="file" accept="image/*">
 <img id="prev" alt="" hidden>
 <p id="dmsg" style="margin-top:10px;font-weight:700;color:#b3261e"></p>
 <div class="cache">
  <button class="btn or" id="save" type="button">Enregistrer</button>
  <button class="btn gris" id="annul" type="button">Annuler</button>
 </div>
</dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,setDoc,deleteDoc,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ===== À REMPLIR : valeurs de ton projet Firebase =====
const firebaseConfig = {
  apiKey: "COLLE_ICI",
  authDomain: "COLLE_ICI",
  projectId: "COLLE_ICI",
  appId: "COLLE_ICI"
};
// =====================================================

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const msg = (t, ok) => { const m = $("#msg"); m.textContent = t || ""; m.className = ok ? "ok" : "err"; };
const erreur = e => {
  const c = (e && e.code) || "";
  if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found") || c.includes("invalid-email")) return "E-mail ou mot de passe incorrect.";
  if (c.includes("too-many-requests")) return "Trop d'essais. Réessaie dans quelques minutes.";
  if (c.includes("permission-denied")) return "Accès refusé : ce compte n'est pas autorisé par les règles Firestore.";
  if (c.includes("network")) return "Pas de connexion internet.";
  return "Erreur : " + (e && e.message ? e.message : e);
};
const fcfa = n => Number(n).toLocaleString("fr-FR") + " F CFA";

if (!Object.values(firebaseConfig).every(v => v && !String(v).startsWith("COLLE"))) {
  $("#login").hidden = true; $("#config").hidden = false;
} else {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let unsub = null, produits = [], courant = null, nouvelleImage = null;

  onAuthStateChanged(auth, u => {
    $("#login").hidden = !!u; $("#app").hidden = !u; $("#out").hidden = !u;
    $("#who").textContent = u ? u.email : "";
    if (unsub) { unsub(); unsub = null; }
    produits = []; rendre();
    if (u) unsub = onSnapshot(collection(db, "produits"), s => {
      produits = s.docs.map(d => ({id: d.id, ...d.data()}))
        .sort((a, b) => ((b.createdAt && b.createdAt.seconds) || 0) - ((a.createdAt && a.createdAt.seconds) || 0));
      rendre();
    }, e => msg(erreur(e)));
  });

  $("#fLogin").addEventListener("submit", async e => {
    e.preventDefault(); msg("");
    try { await signInWithEmailAndPassword(auth, $("#em").value.trim(), $("#pw").value); $("#pw").value = ""; }
    catch (err) { msg(erreur(err)); }
  });
  $("#out").addEventListener("click", () => signOut(auth));

  function rendre() {
    const t = $("#rech").value.trim().toLowerCase();
    const l = produits.filter(p => ((p.nom || "") + " " + (p.cat || "")).toLowerCase().includes(t));
    $("#nb").textContent = produits.length + " produit" + (produits.length > 1 ? "s" : "");
    $("#liste").innerHTML = l.length ? l.map(p => `<div class="ligne" data-id="${esc(p.id)}">
      ${p.image ? `<img src="${esc(p.image)}" alt="">` : `<div class="vide"></div>`}
      <div class="t"><b>${esc(p.nom)}</b><small>${esc(p.cat || "Autres")} · ${p.prix ? fcfa(p.prix) : "Prix sur WhatsApp"}</small></div>
      <div class="act"><button class="btn petit gris" data-a="mod" type="button">Modifier</button><button class="btn petit rouge" data-a="sup" type="button">Supprimer</button></div>
    </div>`).join("") : `<p style="margin-top:16px">Aucun produit pour l'instant. Touche « Ajouter un produit ».</p>`;
    const cats = [...new Set(["Parfums","Eaux de cologne","Soins visage","Soins corps","Hygiène", ...produits.map(p => p.cat).filter(Boolean)])];
    $("#cats").innerHTML = cats.map(c => `<option value="${esc(c)}">`).join("");
  }
  $("#rech").addEventListener("input", rendre);

  $("#liste").addEventListener("click", async e => {
    const b = e.target.closest("button[data-a]"); if (!b) return;
    const p = produits.find(x => x.id === b.closest(".ligne").dataset.id); if (!p) return;
    if (b.dataset.a === "mod") return ouvrir(p);
    if (confirm("Supprimer « " + p.nom + " » ? Cette action est définitive.")) {
      try { await deleteDoc(doc(db, "produits", p.id)); msg("Produit supprimé.", true); } catch (err) { msg(erreur(err)); }
    }
  });

  const dlg = $("#dlg");
  function ouvrir(p) {
    courant = p || null; nouvelleImage = null; $("#dmsg").textContent = "";
    $("#dt").textContent = p ? "Modifier le produit" : "Nouveau produit";
    $("#fn").value = p ? p.nom || "" : ""; $("#fc").value = p ? p.cat || "" : "";
    $("#fd").value = p ? p.desc || "" : ""; $("#fp").value = p && p.prix ? p.prix : "";
    $("#ff").value = "";
    const im = $("#prev"); im.hidden = !(p && p.image); im.src = p && p.image ? p.image : "";
    dlg.showModal();
  }
  $("#ajout").addEventListener("click", () => ouvrir(null));
  $("#annul").addEventListener("click", () => dlg.close());

  function compresser(file, max = 640) {
    return new Promise((res, rej) => {
      const r = new FileReader(); r.onerror = rej;
      r.onload = () => {
        const i = new Image(); i.onerror = rej;
        i.onload = () => {
          const k = Math.min(1, max / Math.max(i.width, i.height));
          const c = document.createElement("canvas");
          c.width = Math.round(i.width * k); c.height = Math.round(i.height * k);
          c.getContext("2d").drawImage(i, 0, 0, c.width, c.height);
          let d = c.toDataURL("image/webp", .72);
          if (!d.startsWith("data:image/webp")) d = c.toDataURL("image/jpeg", .72);
          res(d);
        };
        i.src = r.result;
      };
      r.readAsDataURL(file);
    });
  }
  $("#ff").addEventListener("change", async () => {
    const f = $("#ff").files[0]; if (!f) return;
    $("#dmsg").textContent = "";
    try { nouvelleImage = await compresser(f); const im = $("#prev"); im.src = nouvelleImage; im.hidden = false; }
    catch { $("#dmsg").textContent = "Impossible de lire cette photo."; }
  });

  $("#save").addEventListener("click", async () => {
    const nom = $("#fn").value.trim();
    if (!nom) { $("#dmsg").textContent = "Le nom du produit est obligatoire."; return; }
    const pv = $("#fp").value.trim();
    const data = {
      nom, cat: $("#fc").value.trim() || "Autres", desc: $("#fd").value.trim(),
      prix: pv === "" ? null : Math.max(0, Math.round(Number(pv))),
      image: nouvelleImage || (courant && courant.image) || "",
      updatedAt: serverTimestamp()
    };
    $("#save").disabled = true;
    try {
      if (courant) await setDoc(doc(db, "produits", courant.id), data, {merge: true});
      else await addDoc(collection(db, "produits"), {...data, createdAt: serverTimestamp()});
      dlg.close(); msg("Produit enregistré.", true);
    } catch (err) { $("#dmsg").textContent = erreur(err); }
    $("#save").disabled = false;
  });
}
</script>
</body>
</html>
